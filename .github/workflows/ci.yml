name: AlphaX CI

on:
  push:
    branches: [main, feature/ai-security-control-plane]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Security regression
        run: npm run test:security --workspace server
      - name: Safety regression
        run: npm run test:safety --workspace server
      - name: MCP provider self-test
        run: npm run test:mcp --workspace server
      - name: Intelligence regression
        run: npm run test:intelligence --workspace server
      - name: Production readiness regression
        run: npm run test:production --workspace server
      - name: Secret hygiene regression
        run: npm run test:secrets --workspace server
      - name: Dependency audit
        run: npm audit --audit-level=high
