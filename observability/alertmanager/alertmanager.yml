global:
  resolve_timeout: 5m
  # Default Slack + Email receivers are wired as examples.
  # Fill in tokens/webhooks via environment secrets or edit below.

route:
  group_by: ["alertname", "cluster"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - matchers: ["severity=critical"]
      receiver: "critical"
      continue: true
    - matchers: ["team=infra"]
      receiver: "infra"

receivers:
  - name: "default"
    webhook_configs:
      - url: "${ALERTMANAGER_WEBHOOK:-https://example.com/webhook}"
        send_resolved: true

  - name: "critical"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL:-}"
        channel: "#alerts-critical"
        send_resolved: true
    email_configs:
      - to: "${ALERT_EMAIL_TO:-}"
        from: "${SMTP_FROM:-alertmanager@localhost}"
        smarthost: "${SMTP_HOST:-localhost:25}"
        send_resolved: true

  - name: "infra"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL:-}"
        channel: "#infra"
        send_resolved: true

  - name: "webhook"
    webhook_configs:
      - url: "${ALERTMANAGER_WEBHOOK:-https://example.com/webhook}"
        send_resolved: true