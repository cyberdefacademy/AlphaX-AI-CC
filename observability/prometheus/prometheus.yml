global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: alphax
    host: ${HOSTNAME:-alphax}

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Core AlphaX dashboards server (instrumented with prom-client)
  - job_name: alphax
    static_configs:
      - targets: ["host.docker.internal:8455"]
    metrics_path: /metrics

  # Host metrics (node exporter)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Container metrics (cadvisor)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Pushgateway (for short-lived / batch agent jobs to push to)
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]