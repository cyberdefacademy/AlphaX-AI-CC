# AlphaX Agents OS - single-host observability stack
# Prometheus + Loki + Grafana + cAdvisor + Node Exporter + Alertmanager + Pushgateway + Promtail
#
# Usage:  docker-compose -f observability/docker-compose.yml up -d
name: alphax-observability

services:
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: alphax-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROM_RETENTION:-30d}'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [obs]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: alphax-node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    networks: [obs]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: alphax-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks: [obs]

  loki:
    image: grafana/loki:2.9.8
    container_name: alphax-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    networks: [obs]

  promtail:
    image: grafana/promtail:2.9.8
    container_name: alphax-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ${ALPHAX_HOME:-/home/x3/.alphax-agents-os}:/var/log/alphax:ro
    command:
      - '-config.file=/etc/promtail/promtail-config.yml'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [obs]

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: alphax-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [obs]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alphax-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks: [obs]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: alphax-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}              # CHANGE THIS
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_GITHUB_ENABLED=${GRAFANA_GITHUB_AUTH:-false}
      - GF_AUTH_GITHUB_ALLOW_SIGN_UP=true
      - GF_AUTH_GITHUB_CLIENT_ID=${GRAFANA_GITHUB_CLIENT_ID:-}
      - GF_AUTH_GITHUB_CLIENT_SECRET=${GRAFANA_GITHUB_CLIENT_SECRET:-}
      - GF_AUTH_GITHUB_ALLOWED_ORGANIZATIONS=${GRAFANA_GITHUB_ORG:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks: [obs]

volumes:
  prometheus-data:
  loki-data:
  alertmanager-data:
  grafana-data:

networks:
  obs:
    driver: bridge